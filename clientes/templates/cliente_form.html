{% extends 'principal.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 200px);">
<div class="card shadow-lg m-3 col-md-6">
    <div class="card-body">
        <div class="row">
            <h3 class="text-center mb-4">Cadastro de Cliente</h3>
            <form method="POST" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {% bootstrap_form form %}
                
                <div class="text-end mt-3">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <a href="{% url 'clientes' %}" class="btn btn-secondary text-white" type="button">
                        <span class="text">Cancelar</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
