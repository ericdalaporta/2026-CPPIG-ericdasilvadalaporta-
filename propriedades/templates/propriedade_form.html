{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 200px);">
<div class="card shadow-lg m-3 col-md-6">
    <div class="card-body">
        <div class="row">
            <h3 class="text-center mb-4">Cadastro de Propriedade</h3>
            <form method="POST" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                
                {% bootstrap_field form.nome %}
                
                {% bootstrap_field form.tipo %}  <!--id_tipo foi criado automaticamente pelo django -->
                
                <!-- portão associado (Condicional para Chalé Exclusivo), none significa nao mostrar -->
                <div id="portao-field" style="display: none;">
                    {% bootstrap_field form.portao_associado %}
                </div> 
                <!-- quando escolho chale_exclusivo, vira display block e o campo aparece-->


                
                <div class="text-end mt-3">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <a href="{% url 'propriedades' %}" class="btn btn-secondary" type="button">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<script>

document.addEventListener('DOMContentLoaded', function() { 

    const tipoSelect = document.getElementById('id_tipo'); 

    // procura no html o id="id_tipo" que é o select do tipo de prop
    const portaoField = document.getElementById('portao-field');

    
    tipoSelect.addEventListener('change', function() { 
        // fica observando o tipoSelect, se mudar, dispara a função abaixo

        if (tipoSelect.value === 'CHALE_EXCLUSIVO') {
            portaoField.style.display = 'block';
        } else {
            portaoField.style.display = 'none';
        }

    });

});

</script>
{% endblock %}
